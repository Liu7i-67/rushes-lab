[project]
name = "ms-mcp"
version = "0.1.0"
description = "material-storage MCP 薄代理(官方 mcp 包 FastMCP Streamable HTTP)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    # ★ 官方 mcp 包(不是第三方 fastmcp),版本锁定;传递依赖闭包见 constraints.txt
    "mcp==1.30.0",
    # 两个 httpx 客户端(转发 API / 取缩略图字节)直接使用
    "httpx>=0.27",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
