# material-storage-api dev/local — Phase B-1 skeleton
#
# 启动:
#   1. 先确保 ../poc/minio/docker-compose 已起(poc-pigsty-minio + poc-openfga)
#   2. cp .env.example .env  并填实际值
#   3. docker compose up -d
#   4. docker compose exec api alembic upgrade head    # Phase B-2 后有 migration

services:
  ms-db:
    image: postgres:16-alpine
    container_name: ms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: material_storage
      POSTGRES_USER: msuser
      POSTGRES_PASSWORD: mspass
    volumes:
      # ADR-0008 P0:PG 元数据落 SSD — 生产 .env 设 MS_PG_DATA_DIR=/ssd/pg(bind mount);
      # 留空 = 本地 dev named volume 行为不变
      - ${MS_PG_DATA_DIR:-ms-db-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msuser"]
      interval: 5s
      retries: 10
    networks:
      - poc-net  # 与 ../poc/minio 的 docker network 互通(MinIO / OpenFGA)

  ms-redis:
    image: redis:7-alpine
    container_name: ms-redis
    restart: unless-stopped
    volumes:
      # ADR-0008 P0:Redis 落 SSD — 生产 .env 设 MS_REDIS_DATA_DIR=/ssd/redis;留空 = dev named volume
      - ${MS_REDIS_DATA_DIR:-ms-redis-data}:/data
    networks:
      - poc-net

  ms-api:
    build:
      context: .
      # 镜像源可覆盖(默认清华;部分网络 403 时 export APT_MIRROR / PIP_INDEX_URL 换阿里云)
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: ms-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      ms-db:
        condition: service_healthy
      ms-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8200:8000"   # SSH tunnel access / 后续 nginx 反代到这
    volumes:
      # Phase B-3:整个 app/ bind mount(force-recreate / restart 都不丢;
      # 任何 .py 改动 rsync 后立即生效,无需 rebuild image)
      # host /root/material-storage-api/app/ 是 deploy 时 rsync 进来的
      - ./app:/app/app:ro
      # Phase B-2 dev scripts 也 bind 方便迭代;read-only
      - ./scripts:/app/scripts:ro
    networks:
      - poc-net

  ms-worker:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: ms-worker
    restart: unless-stopped
    command: arq app.workers.main.WorkerSettings
    env_file: .env
    depends_on:
      ms-redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    networks:
      - poc-net

  # ─── MCP 素材服务(2026-10-30 MCP 服务方案 · 包 B)────────────────────────
  # 官方 mcp 包 FastMCP Streamable HTTP 薄代理:不直连 DB/Redis/MinIO,
  # 只经 HTTP 转发 api(身份=PAT)。单副本(会话态在进程内存)。
  # ★ 禁止 env_file:那会把 DB/Redis/MinIO 凭证灌进本服务(架构红线)。
  #   只允许下列显式 environment;宿主侧用 MS_MCP_* 覆盖(见 ../mcp/README.md)。
  # ★ 不 publish 宿主端口:只能经 nginx(/mcp)到达,防绕过 nginx 伪造 XFF。
  # ★ dev:docker-compose.override.yml 只覆盖 container_name / MS_API_BASE_URL /
  #   顶层 networks.poc-net.name(重映射到 dev 网络),service 定义只在本文件。
  # 首次/更新须 `docker compose up -d --build ms-mcp`(独立镜像,restart 不 build)。
  ms-mcp:
    build:
      context: ../mcp
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: ms-mcp
    restart: unless-stopped
    environment:
      MS_API_BASE_URL: ${MS_MCP_API_BASE_URL:-http://ms-api:8000}
      # 入口白名单(host=scheme,逗号分隔;按环境裁剪,条目 ≤14,去重 scheme://host ≤16)。
      # 默认 = **prod 专用 10 条**(不含任何 dev :8090 拼法);dev 必在 override 覆盖为
      # dev 裁剪版 3 条(见 ../mcp/README.md)。prod 无 override 时即用本默认值。
      MS_MCP_ENTRY_ALLOWLIST: ${MS_MCP_ENTRY_ALLOWLIST:-ms.local=http,192.168.110.221=http,192.168.110.221:80=http,47.108.196.211=https,47.108.196.211:443=https,47.108.196.211:18080=http,bucket.taoxiplan.com=https,bucket.taoxiplan.com:443=https,localhost=http,127.0.0.1=http}
      # 取缩略图字节的固定内网入口(必须是上面白名单内的条目,启动时校验)
      MS_MCP_INTERNAL_BASE_URL: ${MS_MCP_INTERNAL_BASE_URL:-http://192.168.110.221}
      # 空闲会话 TTL(秒),同时作为 FastMCP session_idle_timeout 与绑定表淘汰
      MS_MCP_SESSION_TTL: ${MS_MCP_SESSION_TTL:-1800}
      # TLS 信任(内网 http 不校验;公网自签阶段配 CA 或 false,证书转正后切回)
      MS_MCP_VERIFY_TLS: ${MS_MCP_VERIFY_TLS:-true}
      MS_MCP_CA_BUNDLE: ${MS_MCP_CA_BUNDLE:-}
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - poc-net

volumes:
  ms-db-data:
  ms-redis-data:

networks:
  poc-net:
    external: true      # 来自 ../poc/minio/docker-compose
    name: poc-pigsty-minio_poc-net
