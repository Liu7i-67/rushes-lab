name: ms_app
description: 医美素材库移动端(iOS 实况照片 livp 通道 MVP)
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  archive: ^3.6.1
  path_provider: ^2.1.4
  photo_manager: ^3.6.0
  wechat_assets_picker: ^9.4.0
  file_picker: ^8.1.2
  # B0 批新增(§12,用途+批次):
  # url_launcher — B0① 百度授权链接外开系统浏览器(§8.10;不用于 file://)
  url_launcher: ^6.3.3
  # media_store_plus — B0② Android Downloads 落盘 PoC(§6.1 D1②;写 Downloads
  #   免权限仅 API 29+,更低版本依赖 manifest 的 WRITE_EXTERNAL_STORAGE)
  media_store_plus: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# 应用图标生成:flutter pub get 后跑 `dart run flutter_launcher_icons`
# 素材=icon/logo.png(1254×1254 RGB);产物直写 ios/Runner/Assets.xcassets 与
# android/app/src/main/res/mipmap-*(提交入库,Mac 侧无需重跑)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/logo.png"
  remove_alpha_ios: true
