name: ms_app
description: 医美素材库移动端(iOS 实况照片 livp 通道 MVP)
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  archive: ^3.6.1
  path_provider: ^2.1.4
  photo_manager: ^3.6.0
  wechat_assets_picker: ^9.4.0
  file_picker: ^8.1.2
  # B0 批新增(§12,用途+批次):
  # url_launcher — B0① 百度授权链接外开系统浏览器(§8.10;不用于 file://)
  url_launcher: ^6.3.3
  # media_store_plus — B0② Android Downloads 落盘 PoC(§6.1 D1②;写 Downloads
  #   免权限仅 API 29+,更低版本依赖 manifest 的 WRITE_EXTERNAL_STORAGE)
  media_store_plus: ^0.1.3
  # B2 批新增(§12,用途+批次):
  # video_player — B2 预览:视频(mp4/mov/webm/m4v)+ livp 实况短片播放(live-preview-url)
  video_player: ^2.14.1
  # flutter_markdown_plus — B2 预览:.md 内联渲染(flutter_markdown 官方已停更,社区延续版)
  flutter_markdown_plus: ^1.0.12
  # share_plus — B2 预览:pdf iOS 分享面板(快速预览/存储到文件);仅 iOS 走,
  #   Android pdf 本批色块占位(B4 随落盘矩阵点亮)
  share_plus: ^12.0.2
  # mobile-ux-polish 批新增(P8,用途+批次):
  # flutter_local_notifications — P8 传输完成系统级通知(切后台/锁屏时上传下载
  #   终态发本地通知,channel ms_transfers「传输完成」;前台仍走 SnackBar 现状)
  flutter_local_notifications: ^22.3.2
  # mobile-ux-polish-2 批新增(R4d,用途+批次):
  # flutter_foreground_task — R4d 传输前台服务保活(队列存在 queued/running 任务
  #   时启前台服务常驻通知「传输进行中」,提进程优先级防杀;全终态即停不留常驻;
  #   channel ms_transfer_fg「传输进行中」与 P8 完成通知并存;仅 Android,iOS 跳过)
  #   选型理由(定稿):① 只需「保活+常驻通知」,无需后台 isolate 通信/自绘 UI,
  #   fft 的 init/startService/stopService 一对 API 接入面最小;② 自带独立通知
  #   channel 配置,与 P8 channel 并存零冲突;③ 11.0.3 与本仓工具链(Flutter
  #   3.47.7/Dart 3.13/AGP 9.1/Kotlin 2.4/Gradle 9.3.1)兼容。备选
  #   flutter_background_service 需手写 service 配置与通信协议,接入成本更高。
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# 应用图标生成:flutter pub get 后跑 `dart run flutter_launcher_icons`
# 素材=icon/logo.png(1254×1254 RGB);产物直写 ios/Runner/Assets.xcassets 与
# android/app/src/main/res/mipmap-*(提交入库,Mac 侧无需重跑)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/logo.png"
  remove_alpha_ios: true
